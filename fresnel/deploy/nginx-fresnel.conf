# Configuración de nginx como proxy inverso hacia uvicorn.
# Instalar en /etc/nginx/sites-available/fresnel y enlazar en
# sites-enabled — ver deploy/deploy.md.
#
# Reemplaza TU_DOMINIO por el dominio real antes de instalar este archivo.
# certbot reescribe este mismo archivo para agregar los bloques de HTTPS
# (ver deploy/deploy.md, paso de certbot) — no hace falta tocar el bloque
# 443 a mano.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # Tamaño de body generoso mas no excesivo: las peticiones a
    # /api/analizar son JSON pequeño (coordenadas + parámetros), nunca
    # archivos.
    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /api/analizar puede tardar varios segundos en un enlace largo
        # (varios lotes de la API de elevación, con su propio rate
        # limit); el valor por defecto de nginx (60s) puede no bastar.
        proxy_read_timeout    75s;
        proxy_connect_timeout 10s;
    }
}
